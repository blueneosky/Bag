<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Media</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/front.css') }}">
  </head>
  <body>
    <main>
      <h1>Local Media</h1>
      <p><span id="current-path">/</span></p>
      <div class="list-toolbar">
        <p id="status">Loading files...</p>
        <form id="search-form" action="{{ url_for('frontend.index') }}" method="get">
          <label class="visually-hidden" for="tag-search">Search tags</label>
          <input id="tag-search" name="q" type="search" placeholder="Search tags...">
          <button type="submit">Search</button>
        </form>
      </div>
      <table class="file-list">
        <thead class="visually-hidden">
          <tr>
            <th scope="col">Preview and rating</th>
            <th scope="col">Name and tags</th>
          </tr>
        </thead>
        <tbody id="files-list"></tbody>
      </table>
    </main>

    <script>
      const status = document.querySelector("#status");
      const filesList = document.querySelector("#files-list");
      const pageQuery = new URLSearchParams(window.location.search);
      const currentPath = pageQuery.get("path") || "";
      const searchQuery = pageQuery.get("q") || "";
      const searchForm = document.querySelector("#search-form");
      const searchInput = document.querySelector("#tag-search");
      searchInput.value = searchQuery;
      if (currentPath) {
        const pathInput = document.createElement("input");
        pathInput.type = "hidden";
        pathInput.name = "path";
        pathInput.value = currentPath;
        searchForm.appendChild(pathInput);
      }
      const frontendBaseUrl = new URL(window.location.href);
      frontendBaseUrl.pathname = `${frontendBaseUrl.pathname.replace(/\/+$/, "")}/`;

      function getPathUrl(path) {
        const url = new URL(window.location.href);
        url.search = "";
        if (path) {
          url.searchParams.set("path", path);
        }
        return url.toString();
      }

      function renderPathBreadcrumbs() {
        const pathElement = document.querySelector("#current-path");
        const pathParts = currentPath.split("/").filter(Boolean);
        const rootLink = document.createElement("a");
        rootLink.href = getPathUrl("");
        rootLink.textContent = "Home";
        pathElement.replaceChildren(rootLink);

        let accumulatedPath = "";
        pathParts.forEach((part) => {
          accumulatedPath = accumulatedPath ? `${accumulatedPath}/${part}` : part;
          pathElement.append(" / ");
          const link = document.createElement("a");
          link.href = getPathUrl(accumulatedPath);
          link.textContent = part;
          pathElement.appendChild(link);
        });
      }

      renderPathBreadcrumbs();

      function getFolderUrl(folderName) {
        const nextPath = currentPath
          ? `${currentPath.replace(/\/+$/, "")}/${folderName}`
          : folderName;
        const url = new URL(window.location.href);
        url.search = "";
        url.searchParams.set("path", nextPath);
        return url.toString();
      }

      function getFilePath(fileName) {
        return currentPath
          ? `${currentPath.replace(/\/+$/, "")}/${fileName}`
          : fileName;
      }

      function getPreviewUrl(fileId) {
        const url = new URL(`../api/files/preview/${encodeURIComponent(fileId)}`, frontendBaseUrl);
        return url.toString();
      }

      function getPlayerUrl(fileId) {
        const url = new URL(`./player/${fileId}`, frontendBaseUrl);
        return url.toString();
      }

      filesList.addEventListener("click", (event) => {
        if (
          event.button !== 0
          || event.ctrlKey
          || event.metaKey
          || event.shiftKey
          || event.altKey
        ) {
          return;
        }

        const link = event.target instanceof Element
          ? event.target.closest("a[data-player]")
          : null;
        if (!link || !filesList.contains(link) || (link.target && link.target !== "_self")) {
          return;
        }

        const navigationId = window.crypto?.randomUUID?.()
          ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
        try {
          sessionStorage.setItem(`local-media-navigation:${navigationId}`, "1");
        } catch (error) {
          console.warn("Unable to mark internal navigation:", error);
          return;
        }

        const playerUrl = new URL(link.href);
        playerUrl.searchParams.set("navigation_id", navigationId);
        link.href = playerUrl.toString();
      });

      async function loadFiles() {
        try {
          const query = new URLSearchParams();
          if (currentPath) {
            query.set("path", currentPath);
          }
          if (searchQuery.trim()) {
            query.set("q", searchQuery);
          }
          const filesUrl = new URL("../api/files", frontendBaseUrl);
          filesUrl.search = query;
          const response = await fetch(filesUrl);
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          const files = Array.isArray(data.files) ? data.files : [];
          const previews = [];

          files.forEach((file) => {
            const row = document.createElement("tr");
            const visual = document.createElement("td");
            const details = document.createElement("td");
            visual.className = "item-visual";
            details.className = "item-details";
            if (file.type === "folder") {
              const icon = document.createElement("span");
              icon.className = "folder-icon";
              icon.setAttribute("aria-hidden", "true");
              icon.textContent = "📁";
              visual.appendChild(icon);
              const name = document.createElement("a");
              name.href = getFolderUrl(file.name);
              name.className = "item-name";
              name.textContent = file.name;
              details.appendChild(name);
            } else {
              const playerUrl = getPlayerUrl(file.id);
              const previewLink = document.createElement("a");
              const nameLink = document.createElement("a");
              previewLink.dataset.player = "";
              nameLink.dataset.player = "";
              previewLink.href = playerUrl;
              nameLink.href = playerUrl;
              previewLink.className = "preview-link";
              previewLink.textContent = "Loading preview...";
              visual.appendChild(previewLink);
              previews.push({ file, preview: previewLink });
              nameLink.className = "item-name";
              nameLink.textContent = file.name;
              details.appendChild(nameLink);

              const rating = document.createElement("div");
              rating.className = "rating";
              const filledStars = document.createElement("span");
              filledStars.className = "rating-filled";
              filledStars.textContent = "★".repeat(file.rating);
              const emptyStars = document.createElement("span");
              emptyStars.className = "rating-empty";
              emptyStars.textContent = "☆".repeat(5 - file.rating);
              rating.append(filledStars, emptyStars);
              rating.setAttribute("role", "img");
              rating.setAttribute("aria-label", `Rating: ${file.rating} out of 5`);
              visual.appendChild(rating);

              if (file.tags.length) {
                const tags = document.createElement("div");
                tags.className = "item-tags";
                file.tags.forEach((tag) => {
                  const tagElement = document.createElement("span");
                  tagElement.className = "item-tag";
                  tagElement.textContent = tag;
                  tags.appendChild(tagElement);
                });
                details.appendChild(tags);
              }
            }
            row.append(visual, details);
            filesList.appendChild(row);
          });

          status.textContent = files.length
            ? `${files.length} item${files.length === 1 ? "" : "s"}`
            : "No files or folders found.";

          requestAnimationFrame(() => {
            previews.forEach(({ file, preview }) => {
              const image = document.createElement("img");
              image.className = "preview";
              image.alt = `Preview of ${file.name}`;
              image.src = getPreviewUrl(file.id);
              preview.replaceChildren(image);
            });
          });
        } catch (error) {
          status.textContent = `Unable to load files: ${error.message}`;
        }
      }

      loadFiles();
    </script>
  </body>
</html>
