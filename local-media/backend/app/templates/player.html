<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Media Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/player.css') }}">
  </head>
  <body>
    <main>
      <div class="video-details">
        <div class="video-header">
          <a
            class="back-button"
            href="{{ url_for('frontend.index', path=folder_path) }}"
            aria-label="Back to folder"
            title="Back to folder"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h9a7 7 0 0 1 0 14h-2"></path>
            </svg>
          </a>
          <h1 class="video-title">{{ video_name }}</h1>
        </div>
        <div class="metadata-row">
          <div class="rating" role="group" aria-label="Video rating"></div>
          <div class="tag-list" aria-label="Video tags"></div>
          <button class="add-tag" type="button" aria-label="Add a tag" title="Add a tag">+</button>
        </div>
        <p class="metadata-status" role="status" aria-live="polite"></p>
      </div>
      <video
        autoplay
        controls
        disablepictureinpicture
        playsinline
      >
        Your browser does not support video playback.
      </video>
    </main>

  <script>
      const video = document.querySelector("video");
      const videoUrl = new URL("../../api/files/{{ id }}", window.location.href);
      video.src = videoUrl;
      const metadataUrl = new URL("../../api/files/{{ id }}/metadata", window.location.href);
      const ratingElement = document.querySelector(".rating");
      const tagList = document.querySelector(".tag-list");
      const metadataStatus = document.querySelector(".metadata-status");
      let rating = 0;
      let tags = [];

      function showMetadataStatus(message, isSuccess = false) {
        metadataStatus.textContent = message;
        metadataStatus.dataset.success = String(isSuccess);
      }

      async function updateMetadata(method, endpoint, body) {
        const response = await fetch(endpoint, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `Request failed with status ${response.status}`);
        }
        return data;
      }

      function renderRating() {
        ratingElement.replaceChildren();
        for (let score = 1; score <= 5; score += 1) {
          const star = document.createElement("button");
          star.className = `rating-star${score <= rating ? " is-filled" : ""}`;
          star.type = "button";
          star.textContent = score <= rating ? "★" : "☆";
          star.setAttribute("aria-label", `${score} out of 5 stars`);
          star.setAttribute("aria-pressed", String(score === rating));
          star.addEventListener("click", async () => {
            try {
              const data = await updateMetadata("PUT", `${metadataUrl}/rating`, { rating: score });
              rating = data.rating;
              renderRating();
              showMetadataStatus("");
            } catch (error) {
              console.error("Unable to update the video rating:", error);
              showMetadataStatus(`Unable to update rating: ${error.message}`);
            }
          });
          ratingElement.appendChild(star);
        }
      }

      function renderTags() {
        tagList.replaceChildren();
        tags.forEach((tag) => {
          const tagButton = document.createElement("button");
          tagButton.className = "tag";
          tagButton.type = "button";
          tagButton.textContent = tag;
          tagButton.setAttribute("aria-label", `Delete tag ${tag}`);
          tagButton.title = "Click to delete this tag";
          tagButton.addEventListener("click", async () => {
            if (!window.confirm(`Delete the tag "${tag}"?`)) {
              return;
            }
            try {
              const data = await updateMetadata("DELETE", `${metadataUrl}/tags`, { tag });
              tags = data.tags;
              renderTags();
              showMetadataStatus("");
            } catch (error) {
              console.error("Unable to delete the video tag:", error);
              showMetadataStatus(`Unable to delete tag: ${error.message}`);
            }
          });
          tagList.appendChild(tagButton);
        });
      }

      document.querySelector(".add-tag").addEventListener("click", async () => {
        const tag = window.prompt("Enter a new tag:");
        if (tag === null || !tag.trim()) {
          return;
        }
        try {
          const data = await updateMetadata("POST", `${metadataUrl}/tags`, { tag });
          tags = data.tags;
          renderTags();
          showMetadataStatus("");
        } catch (error) {
          console.error("Unable to add the video tag:", error);
          showMetadataStatus(`Unable to add tag: ${error.message}`);
        }
      });

      async function loadMetadata() {
        try {
          const response = await fetch(metadataUrl);
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || `Request failed with status ${response.status}`);
          }
          rating = data.rating;
          tags = data.tags;
          renderRating();
          renderTags();
        } catch (error) {
          console.error("Unable to load video metadata:", error);
          showMetadataStatus(`Unable to load metadata: ${error.message}`);
          renderRating();
          renderTags();
        }
      }

      loadMetadata();

      function consumeInternalNavigationMarker() {
        const navigationId = new URLSearchParams(window.location.search).get("navigation_id");
        if (!navigationId) {
          return false;
        }

        const markerKey = `local-media-navigation:${navigationId}`;
        try {
          const isInternal = sessionStorage.getItem(markerKey) === "1";
          sessionStorage.removeItem(markerKey);
          return isInternal;
        } catch (error) {
          console.warn("Unable to verify internal navigation:", error);
          return false;
        }
      }

      const isInternalNavigation = consumeInternalNavigationMarker();
      const backButton = document.querySelector(".back-button");
      backButton.addEventListener("click", async (event) => {
        event.preventDefault();

        if (isInternalNavigation) {
          window.history.back();
          return;
        }

        try {
          const folderApiUrl = new URL("../../api/files", window.location.href);
          folderApiUrl.searchParams.set("path", {{ folder_path|tojson }});
          const response = await fetch(folderApiUrl);
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          if (typeof data.folder_url !== "string") {
            throw new Error("The files API did not provide a folder URL");
          }

          window.location.assign(data.folder_url);
        } catch (error) {
          console.error("Unable to navigate back to the folder:", error);
          window.location.assign(backButton.href);
        }
      });

      function getSeekZone(event) {
        const bounds = video.getBoundingClientRect();
        const position = event.clientX - bounds.left;

        return {
          left: position < bounds.width / 3,
          right: position > bounds.width * 2 / 3,
        };
      }

      function seek(seconds) {
        const duration = Number.isFinite(video.duration)
          ? video.duration
          : Infinity;

        video.currentTime = Math.max(
          0,
          Math.min(video.currentTime + seconds, duration),
        );
      }

      function preventNativeFullscreen(event) {
        const zone = getSeekZone(event);

        if (zone.left || zone.right) {
          event.preventDefault();
          event.stopPropagation();
        }
      }

      video.addEventListener("pointerdown", preventNativeFullscreen, true);
      video.addEventListener("mousedown", preventNativeFullscreen, true);

      let pendingSeekClick;

      video.addEventListener("click", (event) => {
        const zone = getSeekZone(event);

        if (!zone.left && !zone.right) {
          return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();
        event.stopPropagation();

        // Delay single-click seeking so a double-click only seeks once.
        clearTimeout(pendingSeekClick);
        pendingSeekClick = setTimeout(() => {
          seek(zone.left ? -10 : 10);
          pendingSeekClick = undefined;
        }, 250);
      }, true);

      video.addEventListener("dblclick", async (event) => {
        const zone = getSeekZone(event);

        if (zone.left || zone.right) {
          event.preventDefault();
          event.stopImmediatePropagation();
          event.stopPropagation();

          clearTimeout(pendingSeekClick);
          pendingSeekClick = undefined;
          seek(zone.left ? -10 : 10);
          return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();
        event.stopPropagation();

        if (!document.fullscreenElement) {
          await video.requestFullscreen?.();
        } else {
          await document.exitFullscreen?.();
        }
      }, true);
    </script>
  </body>
</html>
