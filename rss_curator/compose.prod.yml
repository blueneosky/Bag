services:
  webapp:
    image: rss-curator_webapp:latest
    volumes:
      - /var/opt/rss-curator:/data
    environment:
      - UVICORN_RELOAD=true
      - ENV=prod
    healthcheck:
      test: ["CMD", "/app/healthcheck.py", "http://localhost:8000/health"]
      interval: 5m00s
      timeout: 15s
      retries: 3
      start_period: 5s
