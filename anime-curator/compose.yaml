services:
  angular-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: anime-curator-angular-prod
    ports:
      - 8080:8080

  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: anime-curator-angular-dev
    ports:
      - 4200:4200
    develop:
      watch:
        - action: sync
          path: .
          target: /app
