volumes:
  db-data:

services:
  backend:
    profiles: ["prod"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/fresh_summer.db
      FLASK_DEBUG: "0"
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - db-data:/data
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "app.main:app"]

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/fresh_summer.db
      FLASK_DEBUG: "1"
      FLASK_APP: app.main
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - db-data:/data
    command: ["flask", "--app", "app.main", "run", "--host", "0.0.0.0", "--port", "5000", "--debug"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5001:80"